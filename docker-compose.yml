services:
  mongo:
    image: mongo:7
    container_name: videoedit-mongo
    ports:
      - "27017:27017"
    restart: unless-stopped
    volumes:
      - videoedit-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: videoedit-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: videoedit-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PORT: "8000"
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-Clip_AI}
      REDIS_URL: redis://redis:6379/0
      TEMP_DIR: /tmp/videoedit
      FRONTEND_URL: http://localhost:3000
    volumes:
      - videoedit-temp:/tmp/videoedit
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    container_name: videoedit-worker
    command: celery -A app.celery_worker.celery_app worker --loglevel=info --concurrency=2
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-Clip_AI}
      REDIS_URL: redis://redis:6379/0
      TEMP_DIR: /tmp/videoedit
      FRONTEND_URL: http://localhost:3000
    volumes:
      - videoedit-temp:/tmp/videoedit
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_worker.celery_app inspect ping -d celery@$$HOSTNAME | grep -q OK"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:8000}
    container_name: videoedit-frontend
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  videoedit-mongo-data:
  videoedit-temp:
