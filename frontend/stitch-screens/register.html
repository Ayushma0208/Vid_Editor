<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Register - Clip AI</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&amp;family=JetBrains+Mono:wght@500;600&amp;family=Syne:wght@700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "surface-bright": "#faf8ff",
            "tertiary": "#943700",
            "inverse-surface": "#2e3039",
            "on-surface-variant": "#434655",
            "on-secondary-container": "#fffbff",
            "on-tertiary-fixed-variant": "#7d2d00",
            "surface-dim": "#d9d9e5",
            "surface-container-low": "#f3f3fe",
            "primary": "#004ac6",
            "error-container": "#ffdad6",
            "surface-container-lowest": "#ffffff",
            "surface-container": "#ededf9",
            "outline-variant": "#c3c6d7",
            "surface-tint": "#0053db",
            "outline": "#737686",
            "on-tertiary": "#ffffff",
            "primary-fixed-dim": "#b4c5ff",
            "on-tertiary-container": "#ffede6",
            "on-background": "#191b23",
            "on-error-container": "#93000a",
            "on-error": "#ffffff",
            "inverse-on-surface": "#f0f0fb",
            "on-tertiary-fixed": "#360f00",
            "primary-container": "#2563eb",
            "on-secondary-fixed": "#25005a",
            "secondary-fixed-dim": "#d2bbff",
            "on-secondary": "#ffffff",
            "secondary": "#712ae2",
            "on-surface": "#191b23",
            "on-secondary-fixed-variant": "#5a00c6",
            "error": "#ba1a1a",
            "tertiary-fixed": "#ffdbcd",
            "tertiary-fixed-dim": "#ffb596",
            "on-primary": "#ffffff",
            "background": "#faf8ff",
            "secondary-container": "#8a4cfc",
            "tertiary-container": "#bc4800",
            "primary-fixed": "#dbe1ff",
            "surface": "#faf8ff",
            "on-primary-fixed": "#00174b",
            "surface-variant": "#e1e2ed",
            "secondary-fixed": "#eaddff",
            "inverse-primary": "#b4c5ff",
            "surface-container-high": "#e7e7f3",
            "surface-container-highest": "#e1e2ed",
            "on-primary-fixed-variant": "#003ea8",
            "on-primary-container": "#eeefff"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          "spacing": {
            "lg": "24px",
            "inspector-width": "320px",
            "xl": "32px",
            "sm": "8px",
            "xs": "4px",
            "panel-gutter": "1px",
            "sidebar-width": "280px",
            "md": "16px",
            "base": "4px"
          },
          "fontFamily": {
            "display-pro": ["Syne"],
            "timecode-lg": ["JetBrains Mono"],
            "h1-bold": ["Syne"],
            "body-md": ["DM Sans"],
            "technical-mono": ["JetBrains Mono"],
            "body-sm": ["DM Sans"]
          },
          "fontSize": {
            "display-pro": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "800" }],
            "timecode-lg": ["18px", { "lineHeight": "1", "fontWeight": "600" }],
            "h1-bold": ["24px", { "lineHeight": "1.2", "fontWeight": "700" }],
            "body-md": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }],
            "technical-mono": ["12px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "500" }],
            "body-sm": ["13px", { "lineHeight": "1.4", "fontWeight": "400" }]
          }
        }
      }
    }
  </script>
<style>
    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 2px 10px -3px rgba(0,0,0,0.05), 0 10px 20px -5px rgba(0,0,0,0.02), 0 30px 60px -15px rgba(0,0,0,0.05);
      border: 1px solid rgba(225, 226, 237, 0.5);
    }
    
    .input-surgical {
      background: transparent;
      border: none;
      border-bottom: 1px solid #c3c6d7; /* outline-variant */
      border-radius: 0;
      padding-left: 0;
      padding-right: 0;
      transition: all 0.2s ease;
    }
    
    .input-surgical:focus {
      outline: none;
      border: none;
      border-bottom: 1px solid #004ac6; /* primary */
      box-shadow: 0 1px 0 0 #004ac6;
    }
    
    .particle-bg {
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(0, 74, 198, 0.03) 0%, transparent 50%),
        radial-gradient(circle at 85% 30%, rgba(113, 42, 226, 0.03) 0%, transparent 50%);
      background-color: #faf8ff;
    }
  </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex items-center justify-center particle-bg relative overflow-hidden font-body-md text-body-md antialiased">
<!-- Abstract particle representation -->
<div class="absolute inset-0 z-0 pointer-events-none overflow-hidden opacity-40">
<div class="absolute top-1/4 left-1/4 w-2 h-2 rounded-full bg-primary/20 blur-[1px]"></div>
<div class="absolute top-1/3 right-1/3 w-1 h-1 rounded-full bg-secondary/30 blur-[0.5px]"></div>
<div class="absolute bottom-1/4 left-1/3 w-1.5 h-1.5 rounded-full bg-primary/25 blur-[1px]"></div>
<div class="absolute bottom-1/3 right-1/4 w-2 h-2 rounded-full bg-secondary/20 blur-[1px]"></div>
<div class="absolute top-1/2 left-1/2 w-1 h-1 rounded-full bg-primary/40 blur-[0.5px]"></div>
</div>
<main class="relative z-10 w-full max-w-[420px] px-md">
<!-- Logo Anchor -->
<div class="flex items-center justify-center mb-xl">
<div class="flex items-center gap-2">
<span class="w-1.5 h-6 bg-primary rounded-full"></span>
<h1 class="font-display-pro text-display-pro text-on-surface tracking-tighter text-[28px] uppercase">Clip AI</h1>
</div>
</div>
<!-- Registration Card -->
<div class="glass-card rounded-[12px] p-[32px] w-full">
<div class="mb-lg text-center">
<h2 class="font-h1-bold text-h1-bold text-on-surface mb-xs">Create Account</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Join the next generation editing workspace.</p>
</div>
<form action="/api/v1/auth/register" class="space-y-lg" method="POST">
<!-- Name Row -->
<div class="flex gap-md">
<div class="flex-1 space-y-1">
<label class="font-technical-mono text-technical-mono text-on-surface-variant block uppercase tracking-wider text-[10px]" for="firstName">First Name</label>
<input class="input-surgical w-full font-body-md text-body-md text-on-surface h-8" id="firstName" name="firstName" placeholder="Jane" required="" type="text"/>
</div>
<div class="flex-1 space-y-1">
<label class="font-technical-mono text-technical-mono text-on-surface-variant block uppercase tracking-wider text-[10px]" for="lastName">Last Name</label>
<input class="input-surgical w-full font-body-md text-body-md text-on-surface h-8" id="lastName" name="lastName" placeholder="Doe" required="" type="text"/>
</div>
</div>
<!-- Email -->
<div class="space-y-1">
<label class="font-technical-mono text-technical-mono text-on-surface-variant block uppercase tracking-wider text-[10px]" for="email">Email Address</label>
<input class="input-surgical w-full font-body-md text-body-md text-on-surface h-8" id="email" name="email" placeholder="jane@example.com" required="" type="email"/>
</div>
<!-- Password -->
<div class="space-y-1 relative">
<label class="font-technical-mono text-technical-mono text-on-surface-variant block uppercase tracking-wider text-[10px]" for="password">Password</label>
<div class="relative">
<input class="input-surgical w-full font-body-md text-body-md text-on-surface h-8 pr-8" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-0 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[18px]">visibility_off</span>
</button>
</div>
<!-- Strength Indicator -->
<div class="flex gap-1 h-1 mt-2 w-full">
<div class="flex-1 bg-surface-variant rounded-full overflow-hidden">
<div class="w-full h-full bg-error"></div>
</div>
<div class="flex-1 bg-surface-variant rounded-full overflow-hidden">
<div class="w-full h-full bg-tertiary-container"></div>
</div>
<div class="flex-1 bg-surface-variant rounded-full overflow-hidden">
<div class="w-0 h-full bg-yellow-500"></div>
</div>
<div class="flex-1 bg-surface-variant rounded-full overflow-hidden">
<div class="w-0 h-full bg-green-500"></div>
</div>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant text-[11px] mt-1 block">Fair strength</span>
</div>
<!-- Confirm Password -->
<div class="space-y-1 relative">
<label class="font-technical-mono text-technical-mono text-on-surface-variant block uppercase tracking-wider text-[10px]" for="confirmPassword">Confirm Password</label>
<div class="relative">
<input class="input-surgical w-full font-body-md text-body-md text-on-surface h-8 pr-8" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-0 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[18px]">visibility_off</span>
</button>
</div>
</div>
<!-- Submit -->
<button class="w-full h-11 bg-gradient-to-r from-primary to-secondary text-on-primary font-body-md text-body-md font-medium rounded-lg shadow-[0_4px_14px_0_rgba(0,74,198,0.25)] hover:shadow-[0_6px_20px_rgba(0,74,198,0.3)] hover:-translate-y-[1px] transition-all duration-200 mt-md" type="submit">
          Create Account
        </button>
</form>
<!-- Footer Link -->
<div class="mt-xl text-center border-t border-outline-variant/30 pt-md">
<a class="font-body-sm text-body-sm text-primary hover:text-surface-tint transition-colors" href="/login">
          Already have an account? <span class="font-medium">Sign In</span>
</a>
</div>
</div>
</main>
</body></html>
